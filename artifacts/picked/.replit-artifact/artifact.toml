kind = "web"
previewPath = "/"
title = "Picked — Landing Page"
description = "Run the uploaded Picked Pro landing page with its original design and interactive demo."
version = "1.0.0"
id = "artifacts/picked"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20552

[services.development]
run = "pnpm --filter @workspace/picked run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/picked", "run", "build" ]
serve = "static"
publicDir = "artifacts/picked/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20552"
BASE_PATH = "/"

kind = "web"
previewPath = "/"
title = "Mr. Picked — Website"
description = "Static multi-language Mr. Picked website (artifacts/picked/site), generated by artifacts/picked/generator."
version = "1.0.0"
id = "artifacts/picked"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20552

[services.development]
run = "pnpm --filter @workspace/picked run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/picked", "run", "build" ]
serve = "static"
publicDir = "artifacts/picked/dist/public"


[services.env]
PORT = "20552"
BASE_PATH = "/"

openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /visitor-language:
    get:
      operationId: getVisitorLanguage
      summary: Choose a language from the visitor IP country and VPN status
      responses:
        "200":
          description: Language detected or country not supported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorLanguageResult"
        "503":
          description: Detection unavailable; use English
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorLanguageResult"
        "429":
          description: Too many lookups; use English
  /report-requests:
    post:
      operationId: requestReport
      summary: Request a Picked report by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequestInput"
      responses:
        "200":
          description: Request delivered to Picked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportRequestResult"
        "400":
          description: Invalid input
        "429":
          description: Too many requests
        "503":
          description: Email delivery unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    VisitorLanguageResult:
      type: object
      required: [language, country, vpn, reason]
      properties:
        language: { type: string, enum: [EN, SL, HR, IT, DE, HU] }
        country: { type: [string, "null"] }
        vpn: { type: [boolean, "null"] }
        reason: { type: string, enum: [country, vpn, default, unavailable] }
    ReportRequestInput:
      type: object
      additionalProperties: false
      required: [email, business, language, consent, requestId]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        business: { type: string, minLength: 1, maxLength: 200 }
        language: { type: string, enum: [EN, SL, HR, IT, DE, HU] }
        consent: { type: boolean }
        requestId: { type: string, format: uuid }
    ReportRequestResult:
      type: object
      required: [accepted, confirmationSent]
      properties:
        accepted: { type: boolean }
        confirmationSent: { type: boolean }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

